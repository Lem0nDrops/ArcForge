<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c171c">
  <meta name="description" content="ArcForge: an open-world card battler. Scavenge the wasteland, forge cards, and upgrade your robot.">
  <title>ArcForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Title screen -->
  <section id="title" class="screen">
    <div class="title-inner">
      <div id="title-bot" class="title-bot"></div>
      <h1>ArcForge</h1>
      <p class="tag">Scavenge the wasteland. Forge your deck. Build a better robot.</p>
      <div class="title-btns">
        <button class="btn primary big" id="continue" data-act="continue" hidden>Continue</button>
        <button class="btn big" data-act="new">New game</button>
        <button class="btn ghost" data-act="title-help">How to play</button>
      </div>
      <p class="credit">A getdataforge.com game · v0.1</p>
    </div>
  </section>

  <!-- World -->
  <section id="game" class="screen" hidden>
    <canvas id="world" aria-label="World map"></canvas>
    <header class="hud">
      <div class="hud-l">
        <div id="hp" class="bar me"><i></i><span></span></div>
        <div id="where" class="where"></div>
      </div>
      <div class="hud-r">
        <button class="btn" id="workshop-btn" data-act="workshop">Robot & deck</button>
        <button class="btn" data-act="map">Map</button>
        <button class="btn ghost" data-act="menu">Menu</button>
      </div>
      <div id="hudres" class="resbar"></div>
    </header>
    <button id="forge-cta" class="btn primary forge-cta" data-act="forge-cta" hidden>Open Workshop</button>
    <div class="dpad" aria-label="Move">
      <button data-dir="0,-1" class="up" aria-label="Up"></button>
      <button data-dir="-1,0" class="lf" aria-label="Left"></button>
      <button data-dir="1,0" class="rt" aria-label="Right"></button>
      <button data-dir="0,1" class="dn" aria-label="Down"></button>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </section>

  <!-- Battle -->
  <section id="battle" class="screen" hidden><div class="bt"></div></section>

  <div id="panel" class="modal" hidden><div class="sheet"></div></div>
  <div id="menu" class="modal" hidden><div class="sheet narrow"></div></div>
  <div id="result" class="modal" hidden><div class="sheet narrow result"></div></div>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/art.js"></script>
  <script src="js/world.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
